<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="4360" height="2720" viewBox="0 0 1090 680">
  <title>Super Dr Meerkat — back, spine and front of the box</title>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#102931"/><stop offset="1" stop-color="#214e4b"/>
    </linearGradient>
    <linearGradient id="binding" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#152f35"/><stop offset="1" stop-color="#2b6158"/>
    </linearGradient>
    <filter id="gold-ink" color-interpolation-filters="sRGB">
      <feFlood flood-color="#f4d398"/><feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <path fill="url(#board)" d="M0 0h514v680H0z"/>
  <rect x="12" y="12" width="490" height="656" rx="2" fill="none" stroke="#d8be89" stroke-width="1.6"/>
  <image xlink:href="../wordmark.svg" x="55" y="19" width="413" height="141"/>
  <g font-family="Barlow Condensed" font-weight="bold">
    <text x="34" y="228" font-size="53" fill="#ffdc94">FOUR IN A ROW.</text>
    <text x="35" y="365" font-size="19" letter-spacing=".7" fill="#a5ddbc">1–4 PLAYERS</text>
  </g>
  <image xlink:href="retroarch.svg" x="350" y="346" width="133" height="21.28" filter="url(#gold-ink)"/>
  <g font-family="Barlow" font-weight="600" font-size="20" fill="#fff2d4">
    <text x="35" y="267">Match four of one colour across or down</text>
    <text x="35" y="293">to clear germs. Play solo or race up to three</text>
    <text x="35" y="319">friends to clear your bottle first.</text>
  </g>
  <rect x="30" y="386" width="454" height="257.125" fill="#d8be89"/>
  <image xlink:href="../../../.readme/four-player.png" x="32" y="388" width="450" height="253.125"/>

  <g transform="translate(514)">
    <path fill="url(#binding)" d="M0 0h60v680H0z"/>
    <path d="M4 58v610M56 58v610" fill="none" stroke="#b6ad85" stroke-width=".8"/>
    <image xlink:href="../wordmark.svg" transform="translate(53 93) rotate(90)" width="150" height="51"/>
    <text transform="translate(24 432) rotate(90)" text-anchor="middle" font-family="Barlow"
          font-weight="600" font-size="19" fill="#a8c3b3">Courtney Pitcher</text>
    <image xlink:href="meerkat-icon.svg" x="14" y="606" width="32" height="32" filter="url(#gold-ink)"/>
  </g>
  <g transform="translate(574)">
    <path fill="#102b31" d="M0 0h516v680H0z"/>
    <image xlink:href="cover.svg" x="47.333333" y="48" width="421.333333" height="632"/>
  </g>
  <path fill="#efdfbd" d="M514 0h576v48H514z"/>
  <image xlink:href="retroarch-invader.svg" x="525" y="14" width="38" height="20"/>
  <image xlink:href="retroarch.svg" x="737" y="8.8" width="190" height="30.4"/>
</svg>
