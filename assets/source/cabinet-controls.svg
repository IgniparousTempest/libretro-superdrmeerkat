<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="896" height="128" viewBox="0 0 672 96">
  <title>Cabinet controls — red A, yellow B, green C, blue D, ball-top joystick, coin and Start</title>
  <defs>
    <linearGradient id="bezel" x2=".3" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#d6e4ce"/><stop offset=".35" stop-color="#78928a"/>
      <stop offset=".65" stop-color="#405b59"/><stop offset="1" stop-color="#9cb1a0"/>
    </linearGradient>
    <linearGradient id="face-glaze" x1=".15" y1="0" x2=".7" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff8da" stop-opacity=".26"/><stop offset=".48" stop-color="#fff8da" stop-opacity="0"/>
      <stop offset="1" stop-color="#172e34" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="shaft"><stop stop-color="#54706b"/><stop offset=".35" stop-color="#e8f0d8"/>
      <stop offset=".55" stop-color="#a4b9af"/><stop offset="1" stop-color="#536968"/></linearGradient>
    <radialGradient id="ball" cx=".32" cy=".25" r=".82" gradientUnits="objectBoundingBox">
      <stop stop-color="#ff8a74"/><stop offset=".4" stop-color="#f14f48"/>
      <stop offset=".76" stop-color="#cf3940"/><stop offset="1" stop-color="#8c323d"/>
    </radialGradient>
    <g id="push">
      <ellipse cx="48" cy="59" rx="44" ry="33" fill="#0a2026" fill-opacity=".32"/>
      <path d="M5 46c0-20 19-37 43-37s43 17 43 37v7c0 21-19 37-43 37S5 74 5 53z"
            fill="#2c4548" stroke="#132c31" stroke-width="3"/>
      <ellipse cx="48" cy="47" rx="43" ry="37" fill="url(#bezel)" stroke="#192e33" stroke-width="2.5"/>
      <ellipse cx="48" cy="47" rx="37" ry="31" fill="#203639"/>
      <path d="M15 40C15 23 30 12 48 12s33 11 33 28v8c0 17-15 29-33 29S15 65 15 48z"
            fill="currentColor" stroke="#1a3033" stroke-width="2.5"/>
      <path d="M16 45q8 17 31 18t33-18v5c-1 15-15 26-32 26S17 65 16 50z"
            fill="#202f35" opacity=".31"/>
      <ellipse cx="48" cy="40" rx="32" ry="27" fill="currentColor"/>
      <ellipse cx="48" cy="40" rx="32" ry="27" fill="url(#face-glaze)"/>
      <path d="M24 30q4-7 12-10m4-1 4-1" fill="none" stroke="#fff6df" stroke-opacity=".75"
            stroke-linecap="round" stroke-width="3"/>
      <path d="M25 73q10 8 26 7" fill="none" stroke="#ecf2d5" stroke-opacity=".65"
            stroke-linecap="round" stroke-width="1.8"/>
    </g>
  </defs>
  <!-- The four letters are outlines, so tiny cabinet prompts need no installed font. -->
  <g id="button-a" color="#fa514b">
    <use xlink:href="#push"/>
    <path fill="#421f29" fill-rule="evenodd" d="m32 55 11-29h10l12 29h-9l-2-6H43l-2 6zm13-13h7l-3.5-10z"/>
  </g>
  <g id="button-b" transform="translate(96)" color="#ffd034">
    <use xlink:href="#push"/>
    <path fill="#473319" fill-rule="evenodd" d="M36 26h15q12 0 12 8 0 5-5 6 6 2 6 7 0 8-13 8H36zm8 6v5h7q4 0 4-3t-4-2zm0 11v6h7q5 0 5-3t-5-3z"/>
  </g>
  <g id="button-c" transform="translate(192)" color="#36c479">
    <use xlink:href="#push"/>
    <path fill="#15392f" d="m63 31-5 5q-3-3-7-3-8 0-8 8t8 8q5 0 8-4l5 5q-5 7-14 7-16 0-16-16t16-16q8 0 13 6z"/>
  </g>
  <g id="button-d" transform="translate(288)" color="#529df7">
    <use xlink:href="#push"/>
    <path fill="#182f50" fill-rule="evenodd" d="M36 26h13q16 0 16 15T49 55H36zm8 7v15h5q8 0 8-7t-8-8z"/>
  </g>
  <g id="joystick" transform="translate(384)" stroke="#193236" stroke-linejoin="round">
    <ellipse cx="50" cy="83" rx="43" ry="10" fill="#0a2026" opacity=".26" stroke="none"/>
    <path d="m6 68 39-12 44 7 2 12-34 14-49-8z" fill="#3e5555" stroke-width="3"/>
    <path d="m6 68 37-14 45 8-33 15z" fill="#99ada3" stroke-width="3"/>
    <path d="m10 69 44 7 30-12" fill="none" stroke="#dce6cc" stroke-width="2"/>
    <path d="m56 78 1 9" fill="none" stroke-width="2"/>
    <g fill="#314b49" stroke="none"><ellipse cx="18" cy="68" rx="2.2" ry="1.1"/>
      <ellipse cx="75" cy="64" rx="2.2" ry="1.1"/><ellipse cx="56" cy="73" rx="2.2" ry="1.1"/></g>
    <ellipse cx="48" cy="65" rx="18" ry="7.4" fill="#4f6661" stroke-width="2.5"/>
    <ellipse cx="48" cy="64" rx="10" ry="4.4" fill="#23383b" stroke-width="1.5"/>
    <path d="m32 34 8-3 13 31q-1 5-8 3z" fill="url(#shaft)" stroke-width="2.7"/>
    <path d="m34 40 8-3 1 4-7 3z" fill="#304447" stroke-width="1.5"/>
    <circle cx="32" cy="24" r="20.5" fill="url(#ball)" stroke-width="3.3"/>
    <path d="M18 22q0-7 7-11m4-1 3-1" fill="none" stroke="#fff1d5" stroke-width="3.3" stroke-linecap="round"/>
    <path d="M34 40q9-1 13-9" fill="none" stroke="#ad3740" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="coin" transform="translate(480) rotate(11 48 48)" stroke-linejoin="round">
    <ellipse cx="53" cy="51" rx="33" ry="40" fill="#bd8137" stroke="#493e30" stroke-width="3.2"/>
    <path d="m75 26 6 1m-3 8 5 1m-4 8 6 1m-6 8h6m-8 8 6 1m-10 8 5 1m-12 7 6 1"
          fill="none" stroke="#866332" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="45" cy="47" rx="33" ry="40" fill="#f8c65e" stroke="#493e30" stroke-width="3"/>
    <ellipse cx="45" cy="47" rx="26" ry="32" fill="#eeb04f" stroke="#a77335" stroke-width="2.2"/>
    <path d="m45 25 5 15 12 7-13 5-5 17-6-16-11-7 12-6z" fill="#ffe9a2" stroke="#a57537" stroke-width="2.4"/>
    <path d="M19 38q2-14 14-22m4-2 4-1" fill="none" stroke="#fff1bc" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g id="button-start" transform="translate(576)" color="#f5ecd1">
    <use xlink:href="#push"/>
    <path d="M39 26q0-2 2-1l21 13q3 2 0 4L41 55q-2 1-2-1z" fill="#274a48"/>
  </g>
</svg>
