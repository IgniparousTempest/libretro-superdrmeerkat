# Number of enabled cabinet seats, each with its own credit balance (1 through 4).
max_players = 4

# Use "use_native" to match the screen or a fixed size such as "1280x720".
# qHD (960x540), 720p (1280x720), 1080p (1920x1080), QHD (2560x1440).
resolution = "use_native"

# Start in fullscreen. F11 toggles fullscreen during play.
fullscreen = false
sound = true
